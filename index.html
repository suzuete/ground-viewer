<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>川口市・戸田市 野球場 空き状況</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1d2330;--sub:#667085;--line:#e3e6ec;--accent:#1f7a4d;--open:#e6f6ec;--full:#f3f4f6;--sep:#cfd4dd}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1d2128;--text:#e8eaee;--sub:#9aa3b2;--line:#2d333d;--accent:#4cc38a;--open:#17352a;--full:#232830;--sep:#394150}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,"Hiragino Sans","Noto Sans JP",sans-serif}
main{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:1.25rem;margin:0 0 4px}
.meta{color:var(--sub);font-size:.85rem;margin-bottom:12px}
.meta b{color:var(--text)}
.links a{display:inline-block;margin:0 8px 12px 0;padding:6px 12px;border:1px solid var(--line);border-radius:999px;color:var(--accent);text-decoration:none;font-size:.85rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.row:last-child{margin-bottom:0}
.chip{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:999px;padding:4px 12px;font-size:.85rem;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
label{font-size:.9rem;cursor:pointer}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.8rem;color:var(--sub);font-weight:600}
tr.slot{cursor:pointer}
tr.open td:last-child{background:var(--open);color:var(--accent);font-weight:700}
tr.lottery td:last-child{background:#eaf1ff;color:#2b5cc4;font-weight:700}
tr.outside td:last-child{background:#f1eedf;color:#7a6a2a;font-weight:700}
tr.closed,tr.full{color:var(--sub)}
.day{margin:18px 0 6px;padding:6px 12px;background:var(--accent);color:#fff;border-radius:8px;font-weight:700;display:flex;justify-content:space-between}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
.gname{padding:6px 12px;font-weight:700;border-bottom:1px solid var(--line)}
.crow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}
.crow:first-of-type{border-top:0}
.cname{flex:0 0 100%;font-size:.8rem;color:var(--sub)}
.slotchip{border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:.85rem;cursor:pointer;background:transparent;color:var(--sub);font-family:inherit}
.slotchip.open{background:var(--open);color:var(--accent);border-color:var(--accent);font-weight:700}
.slotchip.lottery{background:#eaf1ff;color:#2b5cc4;border-color:#9db8ee;font-weight:700}
.slotchip.outside{background:#f1eedf;color:#7a6a2a;border-color:#d6cf9f;font-weight:700}
.slotchip.full{text-decoration:line-through;opacity:.65}
tr.new-court td{border-top:1px solid var(--line)}
tr.new-ground td{border-top:1px solid var(--sep)}
tr.new-date td{border-top:4px solid var(--accent)}
tr.full td:last-child{background:var(--full)}
.banner{background:#fff4d6;color:#6b4e00;border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:.85rem}
.empty{padding:24px;text-align:center;color:var(--sub)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);max-width:90vw;width:360px}
dialog::backdrop{background:rgba(0,0,0,.4)}
.hint{font-size:.78rem;color:var(--sub);margin:10px 0 4px}
.cmd{display:block;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:.74rem;word-break:break-all;margin:0 0 8px}
.go{display:block;text-align:center;background:var(--accent);color:#fff;border-radius:8px;padding:10px;text-decoration:none;margin:12px 0 8px}
</style>
</head>
<body>
<main>
  <h1>川口市・戸田市 野球場 空き状況</h1>
  <div class="meta">空き枠: <b id="count">読み込み中…</b></div>
  <div class="meta" id="srcStatus"></div>
  <div class="links" id="links"></div>
  <div id="banner"></div>

  <div class="panel">
    <div class="row">
      <button class="chip on" data-view="compact">まとめ表示</button>
      <button class="chip" data-view="table">一覧表</button>
    </div>
    <div class="row">
      <button class="chip on" data-days="we">土日・祝日のみ</button>
      <button class="chip" data-days="all">平日含むすべて</button>
      <label><input type="checkbox" id="onlyOpen" checked> 空き枠のみ表示</label>
    </div>
    <div class="row" id="grounds"></div>
  </div>

  <div id="compact"></div>
  <div class="tablewrap">
    <table>
      <thead><tr><th>日付</th><th>グラウンド</th><th>面名</th><th>時間帯</th><th>状況</th></tr></thead>
      <tbody id="body"></tbody>
    </table>
  </div>
</main>

<dialog id="dlg">
  <div id="dlgBody"></div>
  <a class="go" id="dlgLink" target="_blank" rel="noopener">予約システムで予約・申請</a>
  <button class="chip" onclick="dlg.close()">閉じる</button>
</dialog>

<script>
const $ = id => document.getElementById(id);
const DOW = ["日","月","火","水","木","金","土"];
const state = { data: null, days: "we", ground: "all", view: "compact" };
const ST = { open: "○ 空き", lottery: "抽 抽選", outside: "受付前", closed: "休", full: "× 埋" };
const STL = { open: "空き", lottery: "抽選", outside: "受付期間外(まだ予約できません)", closed: "休館日など", full: "予約済み" };
const MARK = { open: " ○", full: " ×", lottery: " 抽", outside: " 期間外" };
const chipLabel = s => s.period + (s.status === "outside" && s.period === "受付期間外" ? "" : (MARK[s.status] || ""));
const DOWN = ["日","月","火","水","木","金","土"];
function renderCompact(rows) {
  if (!rows.length) return '<div class="empty">条件に合う枠がありません</div>';
  const days = [];
  rows.forEach((s, i) => {
    let day = days[days.length - 1];
    if (!day || day.date !== s.date) { day = { date: s.date, grounds: [] }; days.push(day); }
    let g = day.grounds[day.grounds.length - 1];
    if (!g || g.name !== s.ground) { g = { name: s.ground, courts: [] }; day.grounds.push(g); }
    let c = g.courts[g.courts.length - 1];
    if (!c || c.name !== s.court) { c = { name: s.court, items: [] }; g.courts.push(c); }
    c.items.push([s, i]);
  });
  return days.map(day => {
    const d = new Date(day.date + "T00:00:00");
    const open = day.grounds.flatMap(g => g.courts.flatMap(c => c.items)).filter(([s]) => s.status === "open").length;
    const cards = day.grounds.map(g => `<div class="gcard"><div class="gname">${g.name}</div>` +
      g.courts.map(c => `<div class="crow">${c.name ? `<div class="cname">${c.name}</div>` : ""}` +
        c.items.map(([s, i]) => `<button class="slotchip ${s.status}" data-i="${i}">${chipLabel(s)}</button>`).join("") +
        `</div>`).join("") + `</div>`).join("");
    return `<div class="day"><span>${d.getMonth() + 1}/${d.getDate()}(${DOWN[d.getDay()]})</span><span>${open ? "空き " + open + " 枠" : ""}</span></div>${cards}`;
  }).join("");
}
function applyView() {
  const compact = state.view === "compact";
  $("compact").style.display = compact ? "block" : "none";
  document.querySelector(".tablewrap").style.display = compact ? "none" : "block";
}
function copyCmd() {
  const t = $("cmdText").textContent;
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(
    () => { $("copyBtn").textContent = "コピーしました"; },
    () => { window.prompt("コピーして使ってください", t); });
}
function openDetail(s) {
  const src = (state.data.sources || []).find(x => x.id === s.source) || (state.data.sources || [])[0];
  let assist = "";
  if (s.source === "kawaguchi" && s.status === "open" && /\d+:\d+〜\d+:\d+/.test(s.period)) {
    const py = /Mac|iPhone|iPad/.test(navigator.platform) ? "python3" : "python";
    const cmd = `${py} assist.py ${s.date} "${s.ground}" "${s.court}" "${s.period}"`;
    assist = `<p class="hint">自分のパソコンで予約画面まで進める(assist.py があるフォルダで実行)</p><code class="cmd" id="cmdText">${cmd}</code><button class="chip" id="copyBtn" onclick="copyCmd()">コマンドをコピー</button>`;
  }
  let how = "";
  if (s.source === "kawaguchi" && s.status === "open") {
    const dd = new Date(s.date + "T00:00:00");
    how = `<p class="hint">予約サイトでの選び方:<br>①「施設を検索する」→「${s.ground}」にチェック<br>②「空き状況を確認する」→ ${dd.getMonth() + 1}/${dd.getDate()} を選択<br>③「時間選択画面へ」→ ${s.period}</p>`;
  }
  $("dlgBody").innerHTML = `<h3>${s.ground} ${s.court || ""}</h3><p>${s.date}　${s.period}<br>状況: ${STL[s.status] || "予約済み"}</p>${how}${assist}`;
  const book = BOOK[s.source];
  $("dlgLink").href = book ? book.url : (src ? src.url : "#");
  $("dlgLink").textContent = book ? book.label : "予約システムで予約・申請";
  $("dlg").showModal();
}
const BOOK = {};   // 予約サイトへの専用リンクが必要になったら、ここに { 施設ID: {url, label} } を追加する
const OPENISH = ["open", "lottery", "outside"];
const fmt = iso => iso ? new Date(iso).toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }) : null;
function renderSources(d) {
  const st = d.source_status || {};
  $("srcStatus").innerHTML = (d.sources || []).map(s => {
    const x = st[s.id] || {};
    const cycle = [s.interval_min ? s.interval_min + "分ごと" : "", s.hours ? "取得時間 " + s.hours : ""].filter(Boolean).join("・");
    const t = fmt(x.at);
    let body = t ? `最終取得 <b>${t}</b>` : "未取得";
    if (t && x.ok === false) body += "(直近の取得は失敗。前回の情報を表示中)";
    return `<div>${s.name}: ${body}${cycle ? "(" + cycle + ")" : ""}</div>`;
  }).join("");
}
const pkey = p => (String(p).match(/(\d+):(\d+)/) || ["", "99", "00"]).slice(1).map(x => x.padStart(2, "0")).join(":");

// slots.json が読めないときに表示するデモデータ
function demoData() {
  const grounds = ["サンプル球場A(川口)","サンプル球場B(川口)","サンプル球場C(戸田)"];
  const periods = ["午前","午後","夜間"];
  const slots = [];
  const base = new Date();
  for (let i = 0; i < 45; i++) {
    const d = new Date(base); d.setDate(base.getDate() + i);
    const ds = d.toISOString().slice(0, 10);
    grounds.forEach((g, gi) => ["A面","B面"].forEach((c, ci) => periods.forEach((p, pi) => {
      slots.push({ date: ds, ground: g, court: c, period: p,
        status: (i * 7 + gi * 3 + ci * 5 + pi) % 4 === 0 ? "open" : "full",
        source: g.includes("戸田") ? "toda" : "kawaguchi" });
    })));
  }
  return { updated: new Date().toISOString(), holidays: [], demo: true,
    sources: [{ id: "kawaguchi", name: "川口市予約", url: "https://kawaguchi-city.rakuriza.jp/" },
              { id: "toda", name: "戸田市予約", url: "https://yoyaku.city.toda.saitama.jp/yoyaku/" }], slots };
}

async function load() {
  try {
    const r = await fetch("slots.json?t=" + Date.now());
    if (!r.ok) throw new Error(r.status);
    state.data = await r.json();
  } catch (e) {
    state.data = demoData();
    $("banner").innerHTML = '<div class="banner">slots.json を読み込めなかったため、デモデータを表示しています。</div>';
  }
  const d = state.data;
  $("links").innerHTML = (d.sources || []).map(s => `<a href="${s.url}" target="_blank" rel="noopener">${s.name}</a>`).join("");
  const names = [...new Set(d.slots.map(s => s.ground))];
  $("grounds").innerHTML = ['<button class="chip on" data-g="all">全て</button>']
    .concat(names.map(n => `<button class="chip" data-g="${n}">${n}</button>`)).join("");
  renderSources(d);
  render();
}

function isWeekendOrHoliday(ds) {
  const day = new Date(ds + "T00:00:00").getDay();
  return day === 0 || day === 6 || (state.data.holidays || []).includes(ds);
}

function render() {
  const onlyOpen = $("onlyOpen").checked;
  let rows = state.data.slots.filter(s =>
    (state.days === "all" || isWeekendOrHoliday(s.date)) &&
    (state.ground === "all" || s.ground === state.ground) &&
    (!onlyOpen || OPENISH.includes(s.status)));
  rows.sort((a, b) => (a.date + a.ground + a.court + pkey(a.period)).localeCompare(b.date + b.ground + b.court + pkey(b.period)));
  $("count").textContent = rows.filter(s => s.status === "open").length + " 枠";
  $("body").innerHTML = rows.length ? rows.map((s, i) => {
    const d = new Date(s.date + "T00:00:00");
    const label = `${d.getMonth() + 1}/${d.getDate()}(${DOW[d.getDay()]})`;
    const p = rows[i - 1];
    const g = !p || p.date !== s.date ? "new-date" : p.ground !== s.ground ? "new-ground" : p.court !== s.court ? "new-court" : "";
    return `<tr class="slot ${s.status} ${g}" data-i="${i}"><td>${label}</td><td>${s.ground}</td><td>${s.court || "-"}</td><td>${s.period}</td><td>${ST[s.status] || "× 埋"}</td></tr>`;
  }).join("") : '<tr><td colspan="5" class="empty">条件に合う枠がありません</td></tr>';
  state.rows = rows;
  $("compact").innerHTML = renderCompact(rows);
  applyView();
}

document.addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (chip && chip.dataset.days) {
    state.days = chip.dataset.days;
    document.querySelectorAll("[data-days]").forEach(b => b.classList.toggle("on", b === chip));
    render();
  } else if (chip && chip.dataset.view) {
    state.view = chip.dataset.view;
    document.querySelectorAll("[data-view]").forEach(b => b.classList.toggle("on", b === chip));
    applyView();
  } else if (chip && chip.dataset.g) {
    state.ground = chip.dataset.g;
    document.querySelectorAll("[data-g]").forEach(b => b.classList.toggle("on", b === chip));
    render();
  }
  const sc = e.target.closest(".slotchip");
  if (sc) openDetail(state.rows[+sc.dataset.i]);
  const tr = e.target.closest("tr.slot");
  if (tr) {
    const s = state.rows[+tr.dataset.i];
    const src = (state.data.sources || []).find(x => x.id === s.source) || (state.data.sources || [])[0];
    $("dlgBody").innerHTML = `<h3>${s.ground} ${s.court || ""}</h3><p>${s.date}　${s.period}<br>状況: ${STL[s.status] || "予約済み"}</p>`;
    $("dlgLink").href = src ? src.url : "#";
    $("dlg").showModal();
  }
});
$("onlyOpen").addEventListener("change", render);
load();
</script>
</body>
</html>
