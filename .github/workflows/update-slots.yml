# 配置場所: .github/workflows/update-slots.yml (今のファイルを、この内容に置き換える)
# 実行役: 自分のWindowsパソコン(self-hosted runner)
name: update-slots
on:
  schedule:
    - cron: "*/20 * * * *"      # 20分ごと(戸田市は scraper.py 側で 9:00〜23:59 のみ取得)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-slots
  cancel-in-progress: false
env:
  PYTHONUTF8: "1"               # Windowsで日本語の表示・保存が文字化けしないように
jobs:
  scrape:
    runs-on: [self-hosted, windows]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright jpholiday
      - run: python -m playwright install chromium
      - run: python scraper.py
      - name: commit
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add slots.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "update slots"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
