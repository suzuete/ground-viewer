# 配置場所: .github/workflows/update-slots.yml (今のファイルを、この内容に置き換える)
# 実行役: 自分のWindowsパソコン(self-hosted runner)
name: update-slots
on:
  schedule:
    - cron: "*/20 * * * *"      # 20分ごと(戸田市は scraper.py 側で 9:00〜23:59 のみ取得)
  workflow_dispatch:
    inputs:
      test_notify:
        description: "通知のテスト(ダミーの通知を1通送る)"
        type: boolean
        default: false
permissions:
  contents: write
  issues: write                 # 新しい空きをIssueにして、GitHubからメールを送るため
concurrency:
  group: update-slots
  cancel-in-progress: false
env:
  PYTHONUTF8: "1"               # Windowsで日本語の表示・保存が文字化けしないように
jobs:
  scrape:
    runs-on: [self-hosted, windows]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright jpholiday
      - run: python -m playwright install chromium
      - run: python scraper.py
        env:
          NOTIFY_TEST: ${{ inputs.test_notify }}
      - name: commit
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add slots.json
          git diff --staged --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "update slots"
          for ($i = 0; $i -lt 3; $i++) {
            git pull --rebase -X theirs origin main
            if ($LASTEXITCODE -eq 0) {
              git push
              if ($LASTEXITCODE -eq 0) { exit 0 }
            }
            Start-Sleep -Seconds 5
          }
          exit 1
      - name: notify
        if: hashFiles('notify.json') != ''
        continue-on-error: true
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Invoke-RestMethod -Method Post `
            -Uri "https://api.github.com/repos/${{ github.repository }}/issues" `
            -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" } `
            -ContentType "application/json; charset=utf-8" `
            -InFile notify.json
      - name: notify-mail
        if: hashFiles('notify_line.txt') != ''
        continue-on-error: true
        shell: powershell
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python send_mail.py
